{
"name": "Update podcast feed",
"on": {
"schedule": [
{
"cron": "0 */4 * * *"
}
],
"workflow_dispatch": {}
},
"permissions": {
"contents": "write"
},
"jobs": {
"update": {
"runs-on": "ubuntu-latest",
"steps": [
{
"uses": "actions/checkout@v4"
},
{
"uses": "actions/setup-python@v5",
"with": {
"python-version": "3.12"
}
},
{
"run": "pip install requests beautifulsoup4"
},
{
"run": "python build_feed.py"
},
{
"name": "Save changes",
"run": "git config user.name \"podcast-feed-bot\"\ngit config user.email \"podcast-feed-bot@users.noreply.github.com\"\ngit add feed.xml episodes.json\ngit diff --cached --quiet || (git commit -m \"Update podcast feed\" && git push)\n"
}
]
}
}
}
